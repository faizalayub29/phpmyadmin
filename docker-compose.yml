services:
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: always
    ports:
      - "8050:80"
    environment:
      PMA_HOST: ${PMA_HOST}
      PMA_USER: ${PMA_USER}
      PMA_PASSWORD: ${PMA_PASSWORD}
      PMA_ARBITRARY: 1
      UPLOAD_LIMIT: 512M
      PMA_SSL_CA: /etc/certs/ca-cert.pem  # SSL CA Certificate
    volumes:
      - ./certs:/etc/certs:ro  # Mount CA certificate directory
    networks:
      - phpmyadmin-network

  mysql:
    image: mysql:8
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: mydatabase
      MYSQL_USER: user
      MYSQL_PASSWORD: userpass
      MYSQL_SSL_CA: /etc/certs/ca-cert.pem
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./certs:/etc/certs:ro  # Mount CA certificate directory
    networks:
      - phpmyadmin-network

volumes:
  mysql-data:

networks:
  phpmyadmin-network:
